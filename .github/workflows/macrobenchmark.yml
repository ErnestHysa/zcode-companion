name: macrobenchmark

# §36: Macrobenchmark gates run on a scheduled/nightly cadence, not per-PR
# (emulator time is expensive). §43.2-11.1: cold start + conversation scroll
# frame metrics against the app's `benchmark` variant over the loopback
# MockZCode (INV-15: no production relay, no real credentials).

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

jobs:
  macrobenchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api30-atd

      - name: Create AVD and run the Macrobenchmark gates
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: aosp_atd
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle :baselineprofile:connectedBenchmarkAndroidTest --no-daemon --console=plain

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macrobenchmark-results
          path: baselineprofile/build/outputs/androidTest-results/connected
