syntax = "proto3";

package zcode.android.data;

option java_package = "com.zcode.android.data.proto";
option java_multiple_files = true;

// NotificationRecord persistence (§16: proto/DataStore; 7-day retention; §14.2
// "notification state — Android source of truth"). Dedupe + reconciliation keys
// survive process restarts so §24.3 dedupe and §15-S12 dismissal stay correct.
// §32.3: additive-first — new fields optional, never renumbered.
message NotificationRecordProto {
  optional string notification_key = 1;
  optional string kind = 2; // APPROVAL_NEEDED | USER_INPUT_NEEDED | TASK_FINISHED | TASK_FAILED | CONNECTION_LOST
  optional string task_id = 3;
  optional string interaction_id = 4;
  optional int64 created_at_ms = 5;
  optional int64 seen_at_ms = 6;
}

message NotificationRecordStoreProto {
  optional int32 schema_version = 1;
  repeated NotificationRecordProto records = 2;
}
