syntax = "proto3";

package zcode.android.data;

option java_package = "com.zcode.android.data.proto";
option java_multiple_files = true;

// Sealed credential envelope storage (§12.4): OPAQUE Tink ciphertext bytes only —
// this store never sees plaintext secret material (INV-3; at-rest forensics §3.5).
message CredentialEntryProto {
  optional string name = 1;
  optional bytes blob = 2;
}

message CredentialEnvelopeProto {
  optional int32 schema_version = 1;
  repeated CredentialEntryProto entries = 2;
}
