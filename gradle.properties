# Phase 3: Android modules enter the build (ADR-013). AGP 9.3.x per §10.1.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
# AGP 9 built-in Kotlin would pin its own Kotlin version for android modules; the repo
# standardizes on Kotlin 2.4.20 (core modules compile with it) — keep the KGP path.
android.builtInKotlin=false
# Required companion: the external KGP is incompatible with AGP 9's new DSL.
android.newDsl=false
android.nonTransitiveRClass=true
kotlin.code.style=official
